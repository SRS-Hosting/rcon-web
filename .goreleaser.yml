---
version: 2

project_name: rcon-web

release:
  extra_files:
    - glob: ./LICENSE
  github:
    owner: USA-RedDragon
    name: rcon-web

dockers:
  - image_templates:
      - "ghcr.io/usa-reddragon/rcon-web:{{ .Tag }}-amd64"
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}-amd64"
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}.{{ .Minor }}-amd64"
      - "ghcr.io/usa-reddragon/rcon-web:latest-amd64"
    use: buildx
    goarch: amd64
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - --label=org.opencontainers.image.licenses=MIT
      - --label=org.opencontainers.image.url=https://github.com/USA-RedDragon/{{ .ProjectName }}
      - --label=org.opencontainers.image.source=https://github.com/USA-RedDragon/{{ .ProjectName }}
      - "--platform=linux/amd64"
  - image_templates:
      - "ghcr.io/usa-reddragon/rcon-web:{{ .Tag }}-armv7"
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}-armv7"
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}.{{ .Minor }}-armv7"
      - "ghcr.io/usa-reddragon/rcon-web:latest-armv7"
    use: buildx
    goarch: arm
    goarm: "7"
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - --label=org.opencontainers.image.licenses=MIT
      - --label=org.opencontainers.image.url=https://github.com/USA-RedDragon/{{ .ProjectName }}
      - --label=org.opencontainers.image.source=https://github.com/USA-RedDragon/{{ .ProjectName }}
      - "--platform=linux/arm/v7"
  - image_templates:
      - "ghcr.io/usa-reddragon/rcon-web:{{ .Tag }}-armv6"
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}-armv6"
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}.{{ .Minor }}-armv6"
      - "ghcr.io/usa-reddragon/rcon-web:latest-armv6"
    use: buildx
    goarch: arm
    goarm: "6"
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - --label=org.opencontainers.image.licenses=MIT
      - --label=org.opencontainers.image.url=https://github.com/USA-RedDragon/{{ .ProjectName }}
      - --label=org.opencontainers.image.source=https://github.com/USA-RedDragon/{{ .ProjectName }}
      - "--platform=linux/arm/v6"
  - image_templates:
      - "ghcr.io/usa-reddragon/rcon-web:{{ .Tag }}-arm64"
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}-arm64"
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}.{{ .Minor }}-arm64"
      - "ghcr.io/usa-reddragon/rcon-web:latest-arm64"
    use: buildx
    goarch: arm64
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - --label=org.opencontainers.image.licenses=MIT
      - --label=org.opencontainers.image.url=https://github.com/USA-RedDragon/{{ .ProjectName }}
      - --label=org.opencontainers.image.source=https://github.com/USA-RedDragon/{{ .ProjectName }}
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/usa-reddragon/rcon-web:{{ .Tag }}"
    image_templates:
      - "ghcr.io/usa-reddragon/rcon-web:{{ .Tag }}-amd64"
      - "ghcr.io/usa-reddragon/rcon-web:{{ .Tag }}-arm64"
      - "ghcr.io/usa-reddragon/rcon-web:{{ .Tag }}-armv6"
      - "ghcr.io/usa-reddragon/rcon-web:{{ .Tag }}-armv7"
  - name_template: "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}"
    image_templates:
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}-amd64"
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}-arm64"
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}-armv6"
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}-armv7"
  - name_template: "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}.{{ .Minor }}-amd64"
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}.{{ .Minor }}-arm64"
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}.{{ .Minor }}-armv6"
      - "ghcr.io/usa-reddragon/rcon-web:v{{ .Major }}.{{ .Minor }}-armv7"
  - name_template: "ghcr.io/usa-reddragon/rcon-web:latest"
    image_templates:
      - "ghcr.io/usa-reddragon/rcon-web:latest-amd64"
      - "ghcr.io/usa-reddragon/rcon-web:latest-arm64"
      - "ghcr.io/usa-reddragon/rcon-web:latest-armv6"
      - "ghcr.io/usa-reddragon/rcon-web:latest-armv7"

builds:
  - main: .
    binary: rcon-web
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm
      - arm64
      - riscv64
      - mips
    goarm:
      - "6"
      - "7"
    gomips:
      - "softfloat"
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: riscv64
      - goos: windows
        goarch: mips
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath

milestones:
  - close: true
